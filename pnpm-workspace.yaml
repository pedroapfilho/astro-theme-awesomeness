overrides:
  # Security: force patched transitive releases to clear pnpm audit advisories.
  # Each pin is the lowest release that carries the fix.
  astro: "^7.2.8"
  brace-expansion: "^5.0.12"
  devalue: "^5.9.3"
  fast-uri: "^3.1.8"
  http-cache-semantics: "^4.2.1"
  ip-address: "^10.7.1"
  js-yaml: "^4.3.2"
  "@modelcontextprotocol/sdk": "^1.31.0"
  nanoid: "^3.3.18"
  proxy-addr: "^2.0.8"
  sharp: "^0.35.5"
  shell-quote: "^1.11.0"
  smol-toml: "^1.8.1"
  source-map-js: "^1.2.2"
  svgo: "^4.1.0"

packages:
  - "apps/*"
  - "packages/*"
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

nodeLinker: hoisted
peerDependencyRules:
  allowedVersions:
    "@astrojs/check>typescript": "7"
    "@typescript-eslint/project-service>typescript": "7"
    "@typescript-eslint/tsconfig-utils>typescript": "7"
    "@typescript-eslint/typescript-estree>typescript": "7"
    "@typescript-eslint/utils>typescript": "7"
allowBuilds:
  esbuild: true
  fallow: true
  sharp: true
minimumReleaseAgeExclude:
  - "@dashfoo/*"
  - "@easeia/*"
  - "@usebutr/*"
  - "@walletwright/*"
  - astro-awesomeness
  - oxlint-config-awesomeness
  - "@typescript/typescript6@6.0.2"
  - "@napi-rs/wasm-runtime@1.2.4"
  - magic-string@1.3.1
  - vite@8.3.0
