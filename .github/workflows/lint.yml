name: Lint
on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by release.yml for the changeset-release/main PR, whose
  # pull_request runs are parked unexecuted behind an approval gate.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oxlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true
      # Type-aware linting reads types off disk, and both the workspace .d.ts
      # files and the astro-generated types only exist after a build.
      - run: pnpm build
      - run: pnpm oxlint --format=github .
