name: Publish Checks
on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by release.yml for the changeset-release/main PR, whose
  # pull_request runs are parked unexecuted behind an approval gate.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true
      - run: pnpm typecheck
      - run: pnpm build
      # Packaging hygiene for the published packages (ESM-only).
      - name: publint
        run: (cd packages/astro-awesomeness && pnpm dlx publint --strict)
      - name: are-the-types-wrong
        run: |
          # styles.css is a CSS-only export with no types/JS for attw to resolve.
          (cd packages/astro-awesomeness && pnpm dlx @arethetypeswrong/cli --pack --profile esm-only --exclude-entrypoints ./styles.css)
